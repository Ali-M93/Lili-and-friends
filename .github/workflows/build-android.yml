name: Build Android (Lili)

# يشتغل يدوياً من تبويب Actions > Build Android (Lili) > Run workflow
on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # المشروع كبير، فنفرّغ مساحة بالسيرفر قبل البناء
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      # الأصوات والموديلات محفوظة بـ Git LFS (~1.5 GB). نخزنها بالكاش حتى ما تنزل كل مرة
      - name: List LFS files
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            lfs-

      - name: Pull LFS files
        run: |
          git lfs pull
          rm -f .lfs-assets-id

      - name: Save LFS cache
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}

      # نحفظ مجلد Library حتى لو فشل البناء، حتى البناء الجاي يكون أسرع بكثير
      - name: Restore Unity Library
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-Android-${{ github.run_id }}
          restore-keys: |
            Library-Android-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: LiliLetters

      - name: Save Unity Library
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-Android-${{ github.run_id }}

      - name: Show what takes space inside the APK
        if: success()
        run: |
          ls -lh build/Android
          unzip -l build/Android/*.apk | sort -k1 -n -r | head -40

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiliLetters-apk
          path: build/Android/*.apk
          retention-days: 14
